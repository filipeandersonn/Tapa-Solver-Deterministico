[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapa-solver-deterministico"
version = "0.1.0"
description = "Resolvedor tradicional de Tapa por propagação e backtracking em ordem fixa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
tapa-solver-api = "tapa_solver_deterministico.api:run"

[tool.setuptools.packages.find]
where = ["src"]

